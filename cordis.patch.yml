# dsh-wechat-bridge bundle layer: mounts the iLink gateway and the WeChat
# conversation node as one composed plugin row.
#
# `allowFrom` is REQUIRED with no permissive default: an agent that accepts
# instructions from any WeChat contact is a prompt-injection front door.
# Messages from non-allowlisted senders are logged and ignored, never fed
# to the model. See README.zh.md for the full config.
- insert:
    - id: dsh-wechat-bridge
      name: 'dsh-wechat-bridge'
      config:
        allowFrom: []
